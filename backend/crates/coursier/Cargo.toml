[package]
name = "coursier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Domaine PUR (constitution II) : course active composée, appels, présence,
# preuves d'échec, caisse et indemnisations. Le crate porte sqlx et SON schéma
# (`coursier`) ; tout le reste passe par des traits doublables.
#
# Sens des dépendances, à ne jamais inverser (contracts/ports-coursier.md) :
#
#   coursier ──▶ commandes     lecture de course, port `PreuvesEchec` à implémenter
#   coursier ──▶ qr            empreintes de plaque, politique photo résolue
#   coursier ──▶ prestataires  nom, position, téléphone du vendeur
#   commandes ─╳▶ coursier     JAMAIS — comme commandes ─╳▶ dispatch
#
# ⚠ Aucune arête vers `dispatch`. Le bandeau de K1 mélange les gains (ici) et le
# plafond retenu (là-bas) : la composition se fait dans `backend/api`, qui
# détient déjà les deux dépôts. Faire dépendre `coursier` de `dispatch` pour
# deux nombres créerait une arête permanente entre deux domaines qui n'ont rien
# à se dire.
#
# AUCUNE dépendance nouvelle au workspace (constitution X).
[dependencies]
socle.workspace = true
# Les 7 paramètres de preuve et de service continu, hérités pays → ville.
zones.workspace = true
# Course, arrêts, lignes, secrets hachés de remise, port `PreuvesEchec`.
commandes.workspace = true
# Empreintes de plaque et politique photo du pré-provisionnement (cycle 006).
qr.workspace = true
# Nom, position et contact du vendeur — servis au coursier ASSIGNÉ (R6).
prestataires.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio.workspace = true
