name: mefali_client
description: Application cliente Mefali (commande de repas et courses à Tiassalé).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Épinglé par le SDK Flutter 3.44.6 via flutter_localizations (research.md
  # indiquait 0.20.3 ; la contrainte du SDK prime).
  flutter_riverpod: ^3.3.2
  # Providers GÉNÉRÉS par annotation (constitution XII) — mêmes versions que
  # mefali_core et mefali_pro, déjà figées au lockfile (constitution X).
  riverpod_annotation: ^4.0.3
  intl: 0.20.2
  # Utilisé directement dans l'écran de démarrage (Symbols.*).
  material_symbols_icons: 4.2951.0
  # Clé d'idempotence de la création de commande (UUIDv7 — R7 : elle DEVIENT
  # l'identifiant). Même version que mefali_core et mefali_pro (constitution X).
  uuid: 4.5.3
  # « Utiliser ma position actuelle » de l'écran d'adresse (maquette C3-3a′) —
  # même plugin et même version que le scan de proximité de mefali_pro.
  geolocator: ^14.0.2
  mefali_core:
    path: ../packages/mefali_core
  # Client Dart GÉNÉRÉ — consulté DIRECTEMENT pour la fiche publique d'un
  # vendeur (`GET /prestataires/{id}`, lecture seule, hors cycle CMD), comme le
  # fait mefali_pro pour ses écrans vendeur. Les appels du cycle CMD, eux,
  # passent par `CommandesApi` de mefali_core, qui les teste.
  mefali_api_client:
    path: ../../clients/dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Le harnais de mefali_core rend des types dio (`ResponseBody`,
  # `DioException`) que les tests du parcours manipulent : dépendance DIRECTE
  # de TEST, comme dio l'est en production pour mefali_core.
  dio: 5.10.0
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.4
  build_runner: ^2.15.1
  # Transitive de riverpod_generator, épinglée à l'IDENTIQUE dans les TROIS
  # paquets : SC-008 exige qu'ils génèrent avec la MÊME version — deux `.g.dart`
  # produits par deux générateurs différents divergent sans que rien ne le
  # signale. Ce lockfile l'avait résolue en 4.2.4 contre 4.2.3 ailleurs.
  #
  # ⚠ Le rattrapage précédent n'avait aligné que le LOCKFILE, sans poser de
  # contrainte : la prochaine résolution l'aurait défait, par l'accident exact
  # qui l'avait cassé. `verifier-accord-locks.sh` serait resté vert entre-temps.
  source_gen: 4.2.3

flutter:
  uses-material-design: true
  generate: true
