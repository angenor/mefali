name: mefali_pro
description: Application pro Mefali (coursiers et vendeurs agréés de Tiassalé).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Épinglé par le SDK Flutter 3.44.6 via flutter_localizations (research.md
  # indiquait 0.20.3 ; la contrainte du SDK prime).
  intl: 0.20.2
  # Utilisé directement dans l'écran de démarrage (Symbols.*).
  material_symbols_icons: 4.2951.0
  mefali_core:
    path: ../packages/mefali_core
  # Client Dart GÉNÉRÉ — l'app pro l'appelle directement depuis le cycle CPT
  # (`GET /moi` pour les rôles, dossier coursier en multipart). Jamais d'appel
  # HTTP artisanal (constitution I).
  mefali_api_client:
    path: ../../clients/dart
  # dio apparaît dans la surface publique du client généré (MultipartFile,
  # DioException) sans y être ré-exporté. Version alignée sur le client.
  dio: 5.10.0
  # Collections built_value : le client généré attend des BuiltList (véhicules
  # du dossier coursier). Non ré-exporté par le client — dépendance directe.
  built_collection: 5.1.1
  # Photo de la pièce d'identité du dossier coursier (CPT-04). Déclaré aussi
  # dans mefali_core (provision des plugins natifs) ; ici parce que l'app pro
  # l'IMPORTE — le seul écran qui prend une photo est le sien.
  image_picker: 1.2.3
  # Clés d'idempotence UUIDv7 des POST créateurs (research R14). Version alignée
  # sur celle que le client généré résout déjà.
  uuid: 4.5.3
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  # ── Cycle QRC (006) — scan de collecte en course (research R11). ──
  # Lecture du QR de la plaque (ML Kit / AVFoundation) — ouvre la caméra en
  # propre (déclaration CAMERA au manifest, contrairement à image_picker).
  mobile_scanner: ^7.1.4
  # Position fine pour la porte de présence anti-fraude (< 100 m). Gère aussi
  # sa propre demande de permission runtime (comme mobile_scanner pour la
  # caméra) — pas de permission_handler nécessaire.
  geolocator: ^14.0.2
  # Détection du retour réseau → drainage automatique de la file offline (V).
  connectivity_plus: ^6.1.5
  # sha256 pour la validation d'empreinte HORS-LIGNE (R6) — match du jeton/code
  # scanné contre l'empreinte pré-provisionnée, sans réseau.
  crypto: ^3.0.6
  # ── Cycle CRS (010) — service continu et réveil, US7 (research R12). ──
  #
  # DEUX plugins NATIFS, ajoutés EN UNE FOIS et figés. Shorebird ne patche que
  # le Dart : toute correction qui les touche exigera un passage store. D'où la
  # règle du cycle — les poser tôt, garder TOUTE la logique métier en Dart, et
  # ne plus y revenir. Versions figées à l'ajout (constitution X), pas de `^` :
  # une résolution fraîche casserait l'accord des trois lockfiles.
  #
  # Maintient le processus vivant écran éteint tant que Yao est en ligne :
  # publication de position, interrogation d'offre, échantillonnage de présence.
  # Un WorkManager périodique ne conviendrait pas — 15 min de granularité pour
  # une offre qui dure 40 secondes.
  flutter_foreground_task: 10.0.0
  # Canal dédié de haute importance : son prolongé, ouverture directe de l'écran
  # d'offre. C'est la sonnerie de K2 — sans elle, « téléphone en poche, écran
  # éteint, Yao ne sait pas qu'une course lui est offerte » (constat du cycle
  # 009). Le push de NTF-01 ne remplacerait pas ce canal : il ne maintient ni la
  # position ni la mesure de présence.
  flutter_local_notifications: 22.2.0
  # Composition d'un numéro (`tel:`) et ouverture d'un itinéraire (`geo:`).
  #
  # ⚠ TROISIÈME plugin natif, là où research.md R12 en prévoyait deux. L'écart
  # est assumé et documenté : sans lui, les boutons « Appeler » de K3 et le
  # numéro d'agence de K4-1d n'ouvrent rien — et FR-033 exige que les appels
  # passent PAR L'APP pour compter comme preuve. Un bouton inerte aurait été le
  # pire des deux mondes : la preuve exigée, le moyen absent.
  #
  # Il ne change rien à la règle de R12 (les ajouter tôt, en une fois, garder la
  # logique en Dart) : il arrive dans le même lot, avant tout code d'appel.
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.4
  build_runner: ^2.15.1
  # Transitive de riverpod_generator, épinglée à l'IDENTIQUE dans les trois
  # paquets (SC-008) : deux `.g.dart` produits par deux versions différentes du
  # générateur divergent sans que rien ne le signale.
  source_gen: 4.2.3

flutter:
  uses-material-design: true
  generate: true
