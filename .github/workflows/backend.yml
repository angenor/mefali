name: backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'openapi.json'
      - 'scripts/verifier-schemas-openapi.sh'
      - 'scripts/verifier-frontiere-paiement.sh'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'openapi.json'
      - 'scripts/verifier-schemas-openapi.sh'
      - 'scripts/verifier-frontiere-paiement.sh'
      - '.github/workflows/backend.yml'

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: mefali
          POSTGRES_PASSWORD: mefali
          POSTGRES_DB: mefali
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mefali -d mefali"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://mefali:mefali@localhost:5432/mefali
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # La version 1.97.0 + composants viennent de rust-toolchain.toml (racine).
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
      - name: Installer sqlx-cli
        run: cargo install sqlx-cli@0.9.0 --no-default-features --features native-tls,postgres,sqlx-toml
      - name: Appliquer les migrations
        run: cargo sqlx migrate run
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Cache sqlx à jour
        run: cargo sqlx prepare --workspace --check
      # AVANT les tests, pour la même raison que la frontière fournisseur : une
      # collision de nom de schéma est un défaut de CONTRAT, et savoir que les
      # tests passent au-dessus n'apprend rien — ils ne traversent pas les
      # clients générés. Le script se replace lui-même à la racine, mais le
      # `working-directory` du job vaut `backend` : on le neutralise ici.
      - name: Schémas OpenAPI sans collision
        working-directory: .
        run: ./scripts/verifier-schemas-openapi.sh
      # PAY-05, SC-010, FR-003 — le choix de l'agrégateur doit rester
      # DÉFAISABLE. Ce contrôle échoue si un nom d'agrégateur ou un routage par
      # moyen apparaît hors de `crates/paiements/src/fournisseur/`.
      # Placé AVANT les tests : une frontière franchie est un défaut de
      # conception, et il ne sert à rien de savoir que les tests passent
      # au-dessus d'elle.
      - name: Frontière fournisseur
        working-directory: .
        run: ./scripts/verifier-frontiere-paiement.sh
      - name: Tests
        run: cargo test
