[package]
name = "qr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Domaine PUR (constitution II) : aucune I/O directe — Garage passe par le port
# `socle::DepotObjets`, la course active par `commandes::ArretsDeCollecte`, le
# compteur d'essais par un port `CompteurEssais` (Redis en prod). Les impls
# réelles vivent dans la couche `api` (racine de composition).
[dependencies]
socle.workspace = true
# Socle logistique : transition marquer_arret_collecte + port ArretsDeCollecte.
commandes.workspace = true
# Résolution du jeton (révocation dérivée) + lecture jeton/nom/code de secours.
prestataires.workspace = true
# Paramètres hérités : distance de scan, seuil photo, rétention (ConfigurationZones).
zones.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
# Les empreintes hors-ligne (sha256) sont remontées dans `socle::empreintes` au
# cycle CMD 008 (`qr` dépend de `commandes` — l'inverse serait un cycle) :
# `verification` les ré-exporte, `sha2` n'est plus tiré directement ici.
# Plaque QR imprimable (T018, research R2) — dépendances pures, aucune I/O.
qrcode.workspace = true
printpdf.workspace = true

[dev-dependencies]
tokio.workspace = true
# Harnais d'intégration : agrément réel (PgPrestataires) + comptes/zones pour
# les FK, doubles mémoire de socle, assertions sur l'outbox.
prestataires.workspace = true
comptes.workspace = true
zones.workspace = true
serde_json.workspace = true
chrono.workspace = true
