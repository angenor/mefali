name: mefali_core
description: >-
  Thème Material 3 Mefali (construit depuis docs/design/tokens.md), polices et
  composants partagés des apps Flutter. Aucune transposition DOM/CSS.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # Délégué de localisation du paquet (gen-l10n → MefaliCoreLocalizations) :
  # les écrans canoniques portent leurs propres clés i18n fr.
  flutter_localizations:
    sdk: flutter
  # Épinglé par le SDK Flutter via flutter_localizations (comme les apps).
  intl: 0.20.2
  # Pictogrammes Material Symbols Rounded (tree-shaking des glyphes). Version
  # figée (research.md R2).
  material_symbols_icons: 4.2951.0
  # Client Dart GÉNÉRÉ (jamais d'appel HTTP artisanal — constitution I).
  mefali_api_client:
    path: ../../../clients/dart
  # dio apparaît dans la surface publique du client généré (Dio, Interceptor,
  # DioException) sans y être ré-exporté : dépendance DIRECTE obligatoire pour
  # poser l'intercepteur d'autorisation. Version alignée sur le client (^5.7.0).
  dio: 5.10.0
  # Même raison que dio, pour la couche d'appel commandes (cycle CMD) : les DTO
  # du client généré sont des `built_value`, leurs listes des `BuiltList`, et
  # `standardSerializers.serializeWith` prend un `Serializer<T>` — trois types
  # que le barrel généré n'exporte pas. Versions figées à celles déjà résolues.
  built_value: 8.12.6
  built_collection: 5.1.1
  # Cache local de la configuration distante (hors-ligne — FR-020). Figée (R7).
  shared_preferences: 2.5.5
  # ── Cycle CPT (003) — plugins NATIFS stabilisés tôt (cadrage §10.1 : Shorebird
  # ne patche que le Dart ; les ajouter maintenant évite un passage store). ──
  # Jetons de session au repos : chiffré, jamais shared_preferences (research R11).
  flutter_secure_storage: 10.3.1
  # Photo de la pièce d'identité du dossier coursier (research.md R7, R11).
  image_picker: 1.2.3
  # Enregistrement de la note vocale de repère d'adresse (research.md R11).
  record: 7.1.1
  # Lecture de la note vocale de repère d'adresse (research.md R11).
  just_audio: 0.10.6
  # Clés d'idempotence UUIDv7 côté client (R14) — l'atelier DEV du repère vocal
  # POST une adresse. Version alignée sur mefali_pro (formulaire du dossier).
  uuid: 4.5.3
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  # ── Cycle QRC (006) — file d'actions coursier hors-ligne (research R5). ──
  # drift : SQLite durable, transactionnel, requêtable — nécessaire pour une
  # file portant des OCTETS de photo (shared_preferences ne convient pas).
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.40
  # Chemin du fichier de base drift (répertoire application).
  path_provider: ^2.1.5
  path: ^1.9.1
  # QR de RÉCEPTION du client (CMD-05, maquettes C4-4a et C4-4d). Rendu
  # 100 % local : le bloc « À la livraison » doit se dessiner SANS RÉSEAU
  # (SC-009) — un QR servi en image par l'API serait indisponible hors ligne,
  # c'est-à-dire précisément au moment où on en a besoin. Version figée
  # (constitution X).
  qr_flutter: 4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Horloge simulée pour tester cache/rafraîchissement horaire (T016).
  fake_async: 1.3.3
  riverpod_generator: ^4.0.4
  build_runner: ^2.15.1
  # Codegen des tables drift (.g.dart) — QRC file offline.
  drift_dev: ^2.28.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    # Inter v4.1 embarquée (jamais chargée au runtime — DESIGN §10). OFL 1.1.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
